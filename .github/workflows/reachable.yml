name: reachable

# 해외 IP를 막는 몰이 있어, CI 에서 어디까지 수집 가능한지 확인하는 용도
on:
  workflow_dispatch:

jobs:
  reachable:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m collector._reachable
